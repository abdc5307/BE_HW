<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% for post in posts %}
        {% if post.is_anonymous %}
            <a href = "{% url 'posts:detail' post.id %}">익명으로 쓴 글</a>
        {% else %}
            <a href = "{% url 'posts:detail' post.id %}">{{ post.author.username }}가 쓴 글</a>
        {% endif %}
        <br>
        {{ post.content }}<br>
        작성일 - {{ post.created_at }}<br>
        작성자 - {{ post.author.nickname }}<br><br>
    {% empty %}
        작성한 글이 없습니다
    {% endfor %}

</body>
</html>
